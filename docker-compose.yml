name: rfo

x-logging: &logging
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

networks:
  edge: {}
  core: {}
  db: {}

volumes:
  pgdata: {}
  redisdata: {}
  backoffice_modules: {}

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?missing in .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:?missing in .env}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?missing in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?missing in .env}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD:?missing in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    <<: *logging

  pgbouncer:
    build: ./infra/pgbouncer
    restart: unless-stopped
    environment:
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER:?missing in .env}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?missing in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?missing in .env}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?missing in .env}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD:?missing in .env}
      PGBOUNCER_POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-25}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
    networks: [core, db]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$DB_APP_PASSWORD psql -h 127.0.0.1 -p 5432 -U rfo_app -d rfo -tAc 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    <<: *logging

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --save '' --maxmemory 512mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?missing in .env}
    volumes: [redisdata:/data]
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    <<: *logging

  # Dev-only S3 emulation (ADR 0005)
  storage:
    image: motoserver/moto:latest
    restart: unless-stopped
    entrypoint: ["moto_server"]
    command: ["-H", "0.0.0.0", "-p", "5000"]
    ports:
      - "127.0.0.1:5000:5000"
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request as u; u.urlopen(\"http://127.0.0.1:5000/\", timeout=5)'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    <<: *logging

  storage-init:
    image: motoserver/moto:latest
    restart: "no"
    networks: [core]
    depends_on:
      storage: { condition: service_healthy }
    environment:
      STORAGE_ENDPOINT: http://storage:5000
      BUCKET: ${MINIO_BUCKET_MEDIA:?missing in .env}
    volumes:
      - ./infra/storage/init.py:/init.py:ro
    entrypoint: ["python", "/init.py"]
    <<: *logging

  migrate:
    build: ./infra/migrations
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://rfo_migrator:${DB_MIGRATOR_PASSWORD:?missing in .env}@pgbouncer:5432/rfo
    volumes:
      - ./apps/backend:/app:ro
    working_dir: /app
    networks: [core]
    depends_on:
      pgbouncer: { condition: service_healthy }
    <<: *logging

  api:
    build: ./apps/backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://rfo_app:${DB_APP_PASSWORD:?missing in .env}@pgbouncer:5432/rfo
      JWT_SECRET: ${JWT_SECRET:?missing in .env}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-14}
      CORS_ORIGINS_STORE: ${CORS_ORIGINS_STORE:?missing in .env}
      CORS_ORIGINS_STAFF: ${CORS_ORIGINS_STAFF:?missing in .env}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-stub}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [edge, core]
    depends_on:
      pgbouncer: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request as u; u.urlopen(\"http://127.0.0.1:8000/healthz\", timeout=5)'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    <<: *logging

  worker:
    build: ./apps/backend
    restart: unless-stopped
    command: ["arq", "app.workers.worker.WorkerSettings"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://rfo_app:${DB_APP_PASSWORD:?missing in .env}@pgbouncer:5432/rfo
      JWT_SECRET: ${JWT_SECRET:?missing in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?missing in .env}@redis:6379/0
      AI_PROVIDER: ${AI_PROVIDER:-}
    networks: [core]
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis,os; redis.from_url(os.environ['REDIS_URL']).ping()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    <<: *logging

  nginx:
    image: public.ecr.aws/docker/library/nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      storage: { condition: service_healthy }
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_STORE: ${DOMAIN_STORE:?missing in .env}
      DOMAIN_ADMIN: ${DOMAIN_ADMIN:?missing in .env}
      DOMAIN_API: ${DOMAIN_API:?missing in .env}
      RATE_LIMIT_STORE_RPS: ${RATE_LIMIT_STORE_RPS:-20}
      RATE_LIMIT_STAFF_RPS: ${RATE_LIMIT_STAFF_RPS:-10}
      RATE_LIMIT_LOGIN_RPM: ${RATE_LIMIT_LOGIN_RPM:-10}
    volumes:
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    networks: [edge, core]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    <<: *logging

  backoffice:
    image: public.ecr.aws/docker/library/node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev"]
    volumes:
      - ./apps/backoffice:/app
      - backoffice_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.rfo.localhost}
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    <<: *logging