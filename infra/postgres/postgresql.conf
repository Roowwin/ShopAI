# RFO PostgreSQL 16 - write-heavy OLTP baseline (dev defaults; scale with RAM in prod)
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 3

shared_buffers = 512MB           # prod: ~25% of host RAM
effective_cache_size = 1536MB    # prod: ~60% of host RAM
work_mem = 16MB
maintenance_work_mem = 256MB

random_page_cost = 1.1           # SSD
effective_io_concurrency = 200

wal_compression = on
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
max_slot_wal_keep_size = 2GB     # stale replication slots (Phase 9) cannot eat the disk

# write-heavy hygiene
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_naptime = 30s
idle_in_transaction_session_timeout = '30s'

# observability
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
track_io_timing = on
log_min_duration_statement = 250
log_checkpoints = on
log_lock_waits = on
timezone = 'UTC'
log_timezone = 'UTC'

password_encryption = 'scram-sha-256'
default_text_search_config = 'pg_catalog.english'
# Phase 10: WAL archiving -> RPO <= 5min per completed 16MB segment
archive_mode = on
archive_command = 'test ! -f /wal_archive/%f && gzip < %p > /wal_archive/%f.gz'
